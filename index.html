<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>캐릭터 메이크업 카메라</title>
  <style>
    :root {
      --bg: #1b1b1f;
      --panel: rgba(20, 20, 24, 0.82);
      --text: #f4f4f6;
      --muted: #a9a9b3;
      --accent: #f08aa6;
      --chip: #2c2c33;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
    body { display: flex; flex-direction: column; }
    #stage { position: relative; flex: 1; min-height: 0; overflow: hidden; }
    #view { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #view.mirror { transform: scaleX(-1); }
    #status { position: absolute; inset: auto 16px 16px 16px; text-align: center; color: var(--muted); font-size: 14px; }
    #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity .25s; }
    #controls { background: var(--panel); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; }
    #chars { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .chip { border: 2px solid transparent; background: var(--chip); color: var(--text); padding: 8px 14px; border-radius: 999px; font-size: 15px; cursor: pointer; }
    .chip[aria-pressed="true"] { border-color: var(--accent); }
    #warp-row { display: flex; gap: 12px; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; }
    #warp-row label { display: flex; align-items: center; gap: 8px; }
    #strength { width: 140px; accent-color: var(--accent); }
    #actions { display: flex; align-items: center; justify-content: center; gap: 24px; }
    .side { background: none; border: none; color: var(--muted); font-size: 14px; cursor: pointer; min-width: 80px; }
    #shutter { width: 64px; height: 64px; border-radius: 50%; border: 4px solid #fff; background: var(--accent); cursor: pointer; }
    #shutter:active { transform: scale(.94); }
    #preview { position: fixed; inset: 0; background: rgba(0, 0, 0, .88); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px; padding: 16px; z-index: 10; }
    #preview[hidden] { display: none; }
    #shot { max-width: 100%; max-height: 72vh; border-radius: 12px; }
    #preview .row { display: flex; gap: 12px; }
    .chip.primary { background: var(--accent); color: #2a1a20; font-weight: 600; }
    .hint { margin: 0; color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="view" class="mirror"></canvas>
    <div id="status">준비 중…</div>
    <div id="flash"></div>
  </div>
  <div id="controls">
    <div id="chars">
      <button class="chip" data-char="chiikawa" aria-pressed="true">🐻 치이카와</button>
      <button class="chip" data-char="hachiware" aria-pressed="false">🐱 하치와레</button>
      <button class="chip" data-char="usagi" aria-pressed="false">🐰 우사기</button>
      <button class="chip" data-char="none" aria-pressed="false">없음</button>
    </div>
    <div id="warp-row">
      <button class="chip" id="warp" aria-pressed="false">🫠 변신</button>
      <label>세기 <input type="range" id="strength" min="0" max="100" value="70" /></label>
    </div>
    <div id="actions">
      <button class="side" id="upload">사진 올리기</button>
      <button id="shutter" aria-label="촬영"></button>
      <button class="side" id="camera">카메라</button>
    </div>
    <input type="file" id="file" accept="image/*" hidden />
  </div>
  <div id="preview" hidden>
    <img id="shot" alt="찍은 사진" />
    <div class="row">
      <button class="chip" id="retake">다시 찍기</button>
      <button class="chip primary" id="save">💾 저장</button>
    </div>
    <p class="hint">저장이 안 되면 사진을 길게 눌러 저장해 주세요</p>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
